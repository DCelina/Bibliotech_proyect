<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca - Administración</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23ffcc00%27/%3E%3Cpath d=%27M7 8h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H7zM25 8h-7a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h7z%27 fill=%27%23121212%27/%3E%3C/svg%3E">
</head>
<body>

<nav class="w3-bar w3-yellow w3-card">
    <span class="w3-bar-item"><b>Administración</b></span>
    <a href="/library" class="w3-bar-item w3-button">Catálogo</a>
    <a href="/professor-dashboard" class="w3-bar-item w3-button">Subir material</a>
    <button class="w3-bar-item w3-button w3-right btn-logout">Salir</button>
</nav>

<main class="w3-container w3-padding-32">
    <h2>Usuarios</h2>
    <div class="w3-responsive">
        <table class="w3-table w3-striped w3-bordered lib-card">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Alta</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>

    <h2 class="w3-margin-top">Todos los materiales</h2>
    <div class="w3-responsive">
        <table class="w3-table w3-striped w3-bordered lib-card">
            <thead>
                <tr>
                    <th>Material</th>
                    <th>Materia</th>
                    <th>Publicó</th>
                    <th>Fecha</th>
                    <th>Tamaño</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="allMaterialsTableBody"></tbody>
        </table>
    </div>
</main>

<script src="../js/services/apiService.js"></script>
<script src="../js/components/uiHandlers.js"></script>
<script src="../js/utils/authHelper.js"></script>
<script src="../js/frontControllers/adminFrontController.js"></script>
</body>
</html>
