<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca - Catálogo</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23ffcc00%27/%3E%3Cpath d=%27M7 8h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H7zM25 8h-7a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h7z%27 fill=%27%23121212%27/%3E%3C/svg%3E">
</head>
<body>

<nav class="w3-bar w3-black w3-border-bottom w3-border-dark-grey">
    <a href="/library" class="w3-bar-item w3-text-yellow" style="text-decoration:none"><b>Biblioteca</b></a>
    <span id="navActions" class="w3-right"></span>
</nav>

<main class="w3-container w3-padding-32">
    <h2>Catálogo</h2>

    <form id="searchForm" class="w3-row-padding w3-margin-bottom" role="search">
        <div class="w3-col l6 m6 s12">
            <label for="searchText" class="w3-small">Buscar por título o descripción</label>
            <input class="w3-input w3-border w3-round w3-transparent w3-text-white" type="search" id="searchText" maxlength="100">
        </div>
        <div class="w3-col l4 m4 s8">
            <label for="subjectFilter" class="w3-small">Materia</label>
            <select class="w3-select w3-border w3-round w3-black w3-text-white" id="subjectFilter">
                <option value="">Todas</option>
            </select>
        </div>
        <div class="w3-col l2 m2 s4">
            <label class="w3-small">&nbsp;</label>
            <button type="submit" class="w3-button w3-yellow w3-block w3-round"><b>Buscar</b></button>
        </div>
    </form>

    <div class="w3-responsive">
        <table class="w3-table w3-striped w3-bordered lib-card">
            <thead>
                <tr>
                    <th>Material</th>
                    <th>Materia</th>
                    <th>Publicó</th>
                    <th>Fecha</th>
                    <th>Tamaño</th>
                    <th>Archivo</th>
                </tr>
            </thead>
            <tbody id="materialsTableBody"></tbody>
        </table>
    </div>
</main>

<script src="../js/services/apiService.js"></script>
<script src="../js/components/uiHandlers.js"></script>
<script src="../js/utils/authHelper.js"></script>
<script src="../js/frontControllers/libraryFrontController.js"></script>
</body>
</html>
