<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca - Iniciar sesión</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23ffcc00%27/%3E%3Cpath d=%27M7 8h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H7zM25 8h-7a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h7z%27 fill=%27%23121212%27/%3E%3C/svg%3E">
</head>
<body class="w3-display-container" style="height:100vh;">

    <main class="w3-display-middle w3-mobile" style="width:400px;">
        <div class="w3-card-4 lib-card w3-padding-large w3-round-large">
            <h2 class="w3-center w3-text-yellow"><b>Biblioteca</b></h2>
            <p class="w3-center">Ingresá con tu cuenta</p>

            <form id="loginForm">
                <label for="email">Email</label>
                <input class="w3-input w3-border w3-round w3-transparent w3-text-white" type="email" id="email" autocomplete="username" required>

                <br>
                <label for="password">Contraseña</label>
                <input class="w3-input w3-border w3-round w3-transparent w3-text-white" type="password" id="password" autocomplete="current-password" required>

                <br>
                <button type="submit" class="w3-button w3-yellow w3-block w3-round-large"><b>Iniciar sesión</b></button>
            </form>

            <p class="w3-small w3-center">¿No tenés cuenta? <a href="/register" class="w3-text-yellow">Crear cuenta</a></p>
            <p class="w3-small w3-center"><a href="/library" class="w3-text-yellow">Ver el catálogo</a></p>
        </div>
    </main>

    <script src="../js/services/apiService.js"></script>
    <script src="../js/components/uiHandlers.js"></script>
    <script src="../js/utils/authHelper.js"></script>
    <script src="../js/frontControllers/authFrontController.js"></script>
</body>
</html>
